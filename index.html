<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F7FA;
  --surface:#FFFFFF;
  --surface2:#F0F3F7;
  --border:#D8DEE9;
  --border2:#C0CAD8;
  --text:#1A2840;
  --text2:#4A5F78;
  --text3:#8A9BB0;
  --blue:#0070BA;
  --blue-dark:#003087;
  --blue-light:#E8F3FB;
  --blue-mid:#C5DFF5;
  --red:#E03030;
  --shadow:0 1px 4px rgba(0,48,135,0.08),0 4px 16px rgba(0,48,135,0.06);
  --shadow-sm:0 1px 3px rgba(0,48,135,0.10);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}

/* LOGIN */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;min-height:100vh;width:100%}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:48px 40px;display:flex;flex-direction:column;align-items:center;gap:20px;max-width:380px;width:100%;box-shadow:var(--shadow)}
.login-logo{font-size:39.2px;font-weight:600;color:var(--blue-dark);letter-spacing:-0.5px}
.login-logo span{color:var(--blue)}
.login-sub{font-size:19.6px;color:var(--text2);text-align:center;line-height:1.6}
.btn-google{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--surface);border:1.5px solid var(--border2);border-radius:10px;cursor:pointer;font-family:'Inter',sans-serif;font-size:19.6px;font-weight:500;color:var(--text);transition:all 0.2s;width:100%;justify-content:center}
.btn-google:hover{border-color:var(--blue);background:var(--blue-light);color:var(--blue-dark)}
.btn-google svg{width:18px;height:18px;flex-shrink:0}
.login-note{font-size:16.1px;color:var(--text3);text-align:center}

/* APP SHELL */
#app-screen{display:none;width:100%;align-items:flex-start;justify-content:center}
.app{width:100%;max-width:1600px;background:var(--surface);border-radius:16px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:calc(100vh - 32px)}

/* TOP BAR */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--blue-dark)}
.top-left{display:flex;align-items:center;gap:8px}
.app-logo{font-size:22.4px;font-weight:600;color:#fff;letter-spacing:-0.3px}
.app-logo span{color:#82C4F0}
.sync-sep{color:rgba(255,255,255,0.2);margin:0 6px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#48D48A;flex-shrink:0}
.sync-dot.off{background:#FF6B6B}
.sync-dot.wait{background:#FFB84D}
.sync-label{font-size:15.4px;color:rgba(255,255,255,0.55);font-family:'DM Mono',monospace}
.user-area{display:flex;align-items:center;gap:8px}
.user-avatar{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,0.3)}
.user-name{font-size:18.2px;color:rgba(255,255,255,0.85);font-weight:500}
.btn-logout{font-size:16.8px;padding:5px 12px;border-radius:6px;border:1px solid rgba(255,255,255,0.25);background:transparent;color:rgba(255,255,255,0.7);cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s}
.btn-logout:hover{color:#fff;border-color:rgba(255,255,255,0.7);background:rgba(255,255,255,0.1)}

/* SECTION HEADER */
.ws-banner{padding:18px 20px 0;background:var(--blue-light);border-bottom:1px solid var(--blue-mid)}
.ws-title{font-size:25.2px;font-weight:600;color:var(--blue-dark);margin-bottom:14px}

/* TABS */
.tabs{display:flex;gap:4px}
.tab{padding:9px 15px;font-size:18.2px;font-weight:500;cursor:pointer;border-radius:8px 8px 0 0;color:var(--text3);transition:all 0.15s;white-space:nowrap;font-family:'Inter',sans-serif;border:1px solid transparent;border-bottom:none;position:relative;bottom:-1px}
.tab:hover:not(.active){color:var(--blue);background:rgba(0,112,186,0.07)}
.tab.active{background:var(--surface);color:var(--blue-dark);font-weight:600;border-color:var(--blue-mid);border-bottom-color:var(--surface)}
.badge{display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;min-width:16px;height:16px;border-radius:8px;padding:0 4px;margin-left:5px;background:var(--blue);color:#fff}
.tab.active .badge{background:var(--blue-dark)}

/* PANELS */
.panels{flex:1;display:flex;flex-direction:column}
.panel{display:none;flex:1;overflow-y:auto;padding:20px}
.panel.active{display:block}

/* ENTRY BOX */
.entry-box{background:var(--surface);border:1.5px solid var(--blue-mid);border-radius:12px;padding:16px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.entry-title-row{margin-bottom:10px}
.entry-title-row input{width:100%;font-size:19.6px;padding:10px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;transition:border-color 0.15s}
.entry-title-row input:focus{outline:none;border-color:var(--blue);background:#fff}
.entry-title-row input::placeholder{color:var(--text3)}
.entry-bottom-row{display:flex;gap:10px;align-items:flex-start}
.entry-bottom-row textarea{flex:1;font-size:18.2px;padding:9px 13px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);color:var(--text2);font-family:'Inter',sans-serif;resize:none;height:60px;line-height:1.5;min-width:0;transition:border-color 0.15s}
.entry-bottom-row textarea:focus{outline:none;border-color:var(--blue);background:#fff}
.entry-bottom-row textarea::placeholder{color:var(--text3)}
.entry-side{display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.cat-sel{font-size:18.2px;padding:8px 11px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);color:var(--text2);font-family:'Inter',sans-serif;cursor:pointer;width:140px;transition:border-color 0.15s}
.cat-sel:focus{outline:none;border-color:var(--blue)}
.btn-add{padding:9px 0;width:140px;background:var(--blue);color:white;border:none;border-radius:8px;font-size:18.2px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:background 0.15s}
.btn-add:hover{background:var(--blue-dark)}
.btn-add:active{transform:scale(0.98)}

/* TASK ITEMS */
.task-item{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:10px;border:1px solid transparent;transition:all 0.12s}
.task-item:hover{background:var(--blue-light);border-color:var(--blue-mid)}
.chk{width:18px;height:18px;border-radius:50%;border:2px solid var(--border2);flex-shrink:0;margin-top:1px;cursor:pointer;transition:all 0.2s;background:#fff}
.chk:hover{border-color:var(--blue);background:var(--blue-light)}
.task-body{flex:1;min-width:0}
.task-title-text{font-size:19.6px;color:var(--text);line-height:1.4}
.task-note-text{font-size:17.5px;color:var(--text2);margin-top:3px;font-style:italic;line-height:1.4}
.task-meta{display:flex;gap:7px;align-items:center;margin-top:6px;flex-wrap:wrap}
.task-ts{font-size:14.7px;color:var(--text3);font-family:'DM Mono',monospace}
.task-del{font-size:16.8px;color:var(--text3);cursor:pointer;padding:3px 6px;margin-left:auto;flex-shrink:0;opacity:0;transition:opacity 0.12s;border-radius:4px}
.task-item:hover .task-del{opacity:1}
.task-del:hover{color:var(--red);background:rgba(224,48,48,0.08)}
.cat-pill{display:inline-block;font-size:15.4px;font-weight:500;padding:2px 8px;border-radius:20px}
.empty{text-align:center;padding:48px 0;color:var(--text3);font-size:19.6px}

/* CAT COLUMNS */
.cat-cols{display:grid;gap:10px}
.cat-col{background:var(--surface);border-radius:10px;border:1px solid var(--border);overflow:hidden;min-width:0;box-shadow:var(--shadow-sm)}
.cat-col-head{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;background:var(--surface2)}
.cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cat-col-name{font-size:16.8px;font-weight:600;color:var(--text2)}
.cat-col-count{font-size:15.4px;color:var(--text3);margin-left:auto;font-family:'DM Mono',monospace}
.cat-col-body{padding:8px}
.task-mini{padding:9px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin-bottom:6px;transition:all 0.12s}
.task-mini:last-child{margin-bottom:0}
.task-mini:hover{border-color:var(--blue);background:var(--blue-light)}
.task-mini-top{display:flex;align-items:flex-start;gap:7px}
.mini-chk{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--border2);flex-shrink:0;margin-top:2px;cursor:pointer;transition:all 0.15s;background:#fff}
.mini-chk:hover{border-color:var(--blue)}
.task-mini-title{font-size:17.5px;color:var(--text);line-height:1.4;flex:1;word-break:break-word}
.task-mini-note{font-size:15.4px;color:var(--text2);margin-top:3px;margin-left:20px;line-height:1.4;font-style:italic}
.task-mini-ts{font-size:14px;color:var(--text3);margin-top:4px;margin-left:20px;font-family:'DM Mono',monospace}
.mini-del{font-size:15.4px;color:var(--text3);cursor:pointer;flex-shrink:0;opacity:0;padding:1px 4px;transition:opacity 0.12s;border-radius:3px}
.task-mini:hover .mini-del{opacity:1}
.mini-del:hover{color:var(--red);background:rgba(224,48,48,0.08)}
.col-empty{padding:12px 8px;font-size:16.1px;color:var(--text3);text-align:center}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border-radius:10px;padding:16px;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.stat-val{font-size:39.2px;font-weight:600;color:var(--blue-dark);font-family:'DM Mono',monospace}
.stat-lbl{font-size:16.8px;color:var(--text3);margin-top:4px}

/* HISTORY */
.hist-title{font-size:18.9px;color:var(--text3);text-decoration:line-through}
.hist-note{font-size:16.8px;color:var(--text3);font-style:italic;margin-top:3px}
.hist-meta{display:flex;gap:7px;margin-top:6px;flex-wrap:wrap;align-items:center}
.dur-pill{font-size:15.4px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--blue-light);color:var(--blue-dark)}
.hist-ts{font-size:14.7px;color:var(--text3);font-family:'DM Mono',monospace}

/* JOURNAL */
.journal-entry-box{background:var(--surface);border:1.5px solid var(--blue-mid);border-radius:12px;padding:16px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.journal-entry-box textarea{width:100%;font-size:19.6px;padding:12px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;resize:none;height:120px;line-height:1.7;transition:border-color 0.15s}
.journal-entry-box textarea:focus{outline:none;border-color:var(--blue);background:#fff}
.journal-entry-box textarea::placeholder{color:var(--text3)}
.journal-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.journal-date-lbl{font-size:16.1px;color:var(--text3);font-family:'DM Mono',monospace}
.btn-save{padding:9px 20px;background:var(--blue);color:white;border:none;border-radius:8px;font-size:18.2px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:background 0.15s}
.btn-save:hover{background:var(--blue-dark)}
.journal-list{margin-top:4px}
.journal-item{padding:16px;border-radius:10px;border:1px solid var(--border);background:var(--surface);margin-bottom:10px;box-shadow:var(--shadow-sm)}
.journal-item-date{font-size:15.4px;color:var(--blue);font-family:'DM Mono',monospace;margin-bottom:8px;font-weight:500}
.journal-item-text{font-size:19.6px;color:var(--text);line-height:1.7;white-space:pre-wrap}
.journal-item-actions{display:flex;justify-content:flex-end;margin-top:10px}
.btn-tiny{padding:5px 12px;font-size:16.8px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s}
.btn-tiny:hover{color:var(--red);border-color:var(--red);background:rgba(224,48,48,0.06)}

/* CHECKIN */
.ci-subtabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:0}
.ci-subtab{padding:8px 14px;font-size:17.5px;font-weight:500;cursor:pointer;border-radius:7px 7px 0 0;color:var(--text3);transition:all 0.15s;font-family:'Inter',sans-serif;border:1px solid transparent;border-bottom:none;position:relative;bottom:-1px;background:transparent}
.ci-subtab:hover:not(.active){color:var(--blue);background:rgba(0,112,186,0.06)}
.ci-subtab.active{background:var(--surface);color:var(--blue-dark);font-weight:600;border-color:var(--blue-mid);border-bottom-color:var(--surface)}
.ci-subpanel{display:none}.ci-subpanel.active{display:block}
.checkin-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.checkin-card{background:var(--surface);border:1.5px solid var(--blue-mid);border-radius:12px;padding:18px;box-shadow:var(--shadow-sm)}
.checkin-card-title{font-size:18.2px;font-weight:600;color:var(--blue-dark);margin-bottom:14px}
.checkin-date-lbl{font-size:15.4px;color:var(--text3);font-family:'DM Mono',monospace;margin-bottom:14px}
.ci-field{margin-bottom:12px}
.ci-field label{display:block;font-size:16.8px;color:var(--text2);margin-bottom:5px;font-weight:500}
.ci-field input{width:100%;padding:8px 11px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;font-size:19.6px;transition:border-color 0.15s}
.ci-field input:focus{outline:none;border-color:var(--blue);background:#fff}
.ci-field input::placeholder{color:var(--text3);font-family:'Inter',sans-serif;font-size:16.8px}
.ci-field .ci-hint{font-size:14.7px;color:var(--text3);margin-top:3px}
.btn-checkin-save{width:100%;padding:10px 0;background:var(--blue);color:white;border:none;border-radius:8px;font-size:18.2px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:background 0.15s;margin-top:4px}
.btn-checkin-save:hover{background:var(--blue-dark)}
.btn-checkin-save.weekly{background:var(--blue-dark)}
.checkin-table-wrap{overflow-x:auto}
.checkin-table{width:100%;border-collapse:collapse;font-size:16.8px}
.checkin-table th{background:var(--surface2);color:var(--text3);font-size:14.7px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
.checkin-table td{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text2);font-family:'DM Mono',monospace;font-size:16.8px}
.checkin-table tr:hover td{background:var(--blue-light)}
.checkin-table td.ci-num{font-weight:600;color:var(--text)}
.checkin-table td.ci-good{color:#1A8040;font-weight:700}
.checkin-table td.ci-ok{color:#806010;font-weight:600}
.checkin-table td.ci-low{color:#C02020;font-weight:700}
.weekly-tag{display:inline-block;font-size:12.6px;padding:1px 5px;border-radius:8px;background:var(--blue-light);color:var(--blue-dark);font-weight:600;margin-left:4px;vertical-align:middle}
.stat-section{margin-bottom:20px}
.stat-section-title{font-size:16.8px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:10px}
.stats-grid-2{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat-card-sm{background:var(--surface);border-radius:10px;padding:14px;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.stat-val-sm{font-size:30.8px;font-weight:700;color:var(--blue-dark);font-family:'DM Mono',monospace}
.stat-lbl-sm{font-size:15.4px;color:var(--text3);margin-top:3px}
.trend-bar-wrap{margin-top:6px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.trend-bar{height:100%;border-radius:2px;background:var(--blue);transition:width 0.4s}
.ci-export-row{display:flex;justify-content:flex-end;margin-bottom:10px}
.btn-export-sm{padding:6px 14px;font-size:16.8px;font-weight:600;border-radius:7px;border:1.5px solid var(--blue);background:transparent;color:var(--blue);cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s}
.btn-export-sm:hover{background:var(--blue);color:#fff}
.ci-del-btn{width:22px;height:22px;border-radius:5px;border:1px solid transparent;background:transparent;color:var(--text3);cursor:pointer;font-size:16.8px;line-height:1;transition:all 0.12s;padding:0}
.ci-del-btn:hover{color:var(--red);background:rgba(224,48,48,0.08);border-color:rgba(224,48,48,0.2)}

/* JOURNAL SIDEBAR */
.journal-layout{display:flex;gap:14px;height:100%}
.journal-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.journal-sidebar{width:200px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.journal-sidebar-title{font-size:15.4px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;padding:0 4px;margin-bottom:4px}
.journal-sidebar-item{padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:all 0.12s}
.journal-sidebar-item:hover{border-color:var(--blue);background:var(--blue-light)}
.journal-sidebar-item.selected{border-color:var(--blue-dark);background:var(--blue-light);font-weight:600}
.journal-sidebar-date{font-size:14px;color:var(--blue);font-family:'DM Mono',monospace;margin-bottom:3px}
.journal-sidebar-preview{font-size:16.1px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.journal-export-btn{padding:7px 0;width:100%;background:transparent;border:1.5px solid var(--blue);color:var(--blue);border-radius:8px;font-size:16.8px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s;margin-top:auto}
.journal-export-btn:hover{background:var(--blue);color:#fff}
.journal-reader{background:var(--surface);border:1.5px solid var(--blue-mid);border-radius:12px;padding:20px;box-shadow:var(--shadow-sm);display:none}
.journal-reader.visible{display:block}
.journal-reader-date{font-size:15.4px;color:var(--blue);font-family:'DM Mono',monospace;margin-bottom:10px;font-weight:500}
.journal-reader-text{font-size:19.6px;color:var(--text);line-height:1.8;white-space:pre-wrap}

/* HIST DELETE */
.hist-item{padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);margin-bottom:8px;display:flex;align-items:flex-start;gap:8px;transition:all 0.12s}
.hist-item:hover{background:var(--blue-light);border-color:var(--blue-mid)}
.hist-body{flex:1;min-width:0}
.hist-del-btn{flex-shrink:0;width:24px;height:24px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--text3);cursor:pointer;font-size:18.2px;display:flex;align-items:center;justify-content:center;opacity:0;transition:all 0.12s;margin-top:1px}
.hist-item:hover .hist-del-btn{opacity:1}
.hist-del-btn:hover{color:var(--red);background:rgba(224,48,48,0.08);border-color:rgba(224,48,48,0.2)}

/* MOBILE */
/* DATA PANEL */
.data-report-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.data-report-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.data-report-title{font-size:18px;font-weight:700;color:var(--blue-dark)}
.data-report-date{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace}
.data-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.data-stat{background:var(--blue-light);border-radius:10px;padding:12px 14px;text-align:center}
.data-stat-val{font-size:28px;font-weight:800;color:var(--blue-dark);font-family:'DM Mono',monospace}
.data-stat-lbl{font-size:11px;color:var(--text3);margin-top:3px;font-weight:500}
.data-section-lbl{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px;margin:12px 0 6px}
.data-tracker-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.data-tracker-pill{font-size:12px;padding:3px 10px;border-radius:6px;font-weight:600}
.data-tracker-pill.green{background:#E8FDF2;color:#1A7A48}
.data-tracker-pill.red{background:#FEF0EE;color:#B02820}
.data-poids-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.data-poids-badge{font-size:13px;padding:4px 12px;border-radius:8px;font-weight:600;background:var(--surface2);color:var(--text2)}

}

function hideModulePicker() {
  document.getElementById('module-picker-overlay').classList.remove('open');
}

function renderModulePicker() {
  const mods = userModules || [];
  document.getElementById('module-picker-grid').innerHTML = MODULES.map(m => {
    const active = mods.includes(m.id);
    return `<div class="module-card${active?' active':''}" onclick="APP.toggleModule('${m.id}')">
      <div class="module-card-icon">${m.icon}</div>
      <div class="module-card-label">${m.label}</div>
      <div class="module-card-desc">${m.desc}</div>
      <div class="module-card-badge">${active ? 'Remove' : 'Add'}</div>
    </div>`;
  }).join('');
}

async function toggleModule(id) {
  const mods = [...(userModules||[])];
  const idx = mods.indexOf(id);
  if(idx >= 0) mods.splice(idx, 1);
  else mods.push(id);
  userModules = mods;
  await fbSet(ref(db, `users/${currentUID}/settings/modules`), mods.length ? mods : null);
  renderModulePicker();
  if(!mods.length) {
    showTab('home');
  } else if(activeTab === 'home' || !mods.includes(activeTab)) {
    showTab(mods[0]);
  } else {
    renderTabs();
  }
}

function startListening() {
  if(dbListener) dbListener();
  dbListener = onValue(ref(db,`users/${currentUID}`), (snapshot) => {
    const val = snapshot.val();
    if(val) {
      data.vie = val.vie||{};
      if(!data.vie.checkin) data.vie.checkin = {};
      if(!data.vie.tracker) data.vie.tracker = {};
      if(!data.vie.tracker_archives) data.vie.tracker_archives = {};
      if(!data.vie.tracker_q_archives) data.vie.tracker_q_archives = {};
      if(!data.vie.tracker_buttons) data.vie.tracker_buttons = {};
      if(!data.vie.weekly_reports) data.vie.weekly_reports = {};
      data._flags = val._flags||{};
      journalCats = objToArr(val.journal_cats||{}).sort((a,b)=>a.createdAt-b.createdAt);
      const newMods = val.settings?.modules || null;
      const hadModules = userModules !== null;
      userModules = newMods;
      if(!userModules || !userModules.length) {
        activeTab = 'home';
      } else if(!hadModules || activeTab === 'home' || !userModules.includes(activeTab)) {
        activeTab = userModules[0];
      }
      migrateLegacyTrackerButtons();
    } else {
      data = {vie:{tasks:{},history:{},journal:{},checkin:{},tracker:{},tracker_archives:{},tracker_q_archives:{},tracker_buttons:{},weekly_reports:{}}};
      data._flags = {};
      userModules = null;
      journalCats = [];
      activeTab = 'home';
    }
    setSyncStatus('ok');
    renderTabs();
    renderAll();
    checkAutoWeeklyReport();
  }, () => setSyncStatus('off'));
}

function showTab(t) {
  activeTab = t;
  renderTabs();
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  const panel = document.getElementById('panel-'+t);
  if(panel) panel.classList.add('active');
  else document.getElementById('panel-home').classList.add('active');
  renderAll();
}

function renderTabs() {
  const mods = userModules || [];
  const tasks = objToArr(wsd().tasks);
  const journal = objToArr(wsd().journal);
  const history = objToArr(wsd().history);

  const META = {
    'tasks':          { label: 'Tasks',            badge: tasks.length },
    'cats':           { label: 'By Category',       badge: null },
    'checkin-daily':  { label: 'Daily Check-in',    badge: null },
    'checkin-weekly': { label: 'Weekly Check-in',   badge: null },
    'journal':        { label: 'Journal',           badge: journal.length },
    'tracker':        { label: 'Tracker',           badge: null },
    'data':           { label: 'Data',              badge: null },
    'history':        { label: 'History',           badge: history.length },
  };

  const tabsHtml = mods.map(id => {
    const m = META[id]; if(!m) return '';
    const b = m.badge!=null ? `<span class="badge">${m.badge}</span>` : '';
    return `<div class="tab${activeTab===id?' active':''}" draggable="true"
      onclick="APP.showTab('${id}')"
      ondragstart="APP.tabDragStart(event,'${id}')"
      ondragover="APP.tabDragOver(event,'${id}')"
      ondragleave="APP.tabDragLeave(event)"
      ondrop="APP.tabDrop(event,'${id}')"
      ondragend="APP.tabDragEnd(event)"
    >${m.label}${b}</div>`;
  }).join('');

  document.getElementById('tabs-row').innerHTML = tabsHtml +
    `<div class="tab tab-add" onclick="APP.showModulePicker()" title="Add or remove modules">+</div>`;
}

// ---- RENDER JOURNAL ----

function renderJournal() {
  const el = document.getElementById('panel-journal');
  const allEntries = objToArr(wsd().journal);
  const todayISO = localDateISO();

  function catById(fbKey) {
    return journalCats.find(c=>c.fbKey===fbKey) || null;
  }
  function jCatPill(catKey) {
    const c = catById(catKey);
    if(!c) return '';
    return `<span class="journal-cat-pill" style="background:${c.bg};color:${c.c}">${c.label}</span>`;
  }
  function entryDateISO(j) {
    return j.entryDate || new Date(j.createdAt).toISOString().split('T')[0];
  }
  function entryDateFmt(j) {
    const iso = entryDateISO(j);
    const d = new Date(iso + 'T12:00:00');
    return d.toLocaleDateString('en-US', {weekday:'short', year:'numeric', month:'short', day:'numeric'});
  }

  // Reset filter if the filtered cat no longer exists
  if(journalFilter !== 'all' && !catById(journalFilter)) journalFilter = 'all';

  const filteredEntries = journalFilter === 'all'
    ? allEntries
    : allEntries.filter(j => j.cat === journalFilter);

  // Filter bar (only shown if there are categories)
  const filterBar = journalCats.length ? `<div class="journal-filter-bar">
    <button class="journal-filter-btn${journalFilter==='all'?' active':''}" onclick="APP.setJournalFilter('all')">All (${allEntries.length})</button>
    ${journalCats.map(c=>{
      const n = allEntries.filter(j=>j.cat===c.fbKey).length;
      return `<button class="journal-filter-btn${journalFilter===c.fbKey?' active':''}" onclick="APP.setJournalFilter('${c.fbKey}')" style="border-color:${c.bg}">${c.label} (${n})</button>`;
    }).join('')}
  </div>` : '';

  // Category manager
  const catManagerHtml = `<div class="tracker-manage-box" style="margin-bottom:16px">
    <div class="tracker-manage-title">🏷 Categories</div>
    ${journalCats.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">
      ${journalCats.map(c=>`
        <span style="display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:13px;font-weight:600;background:${c.bg};color:${c.c}">
          ${c.label}
          <span onclick="APP.deleteJournalCat('${c.fbKey}')" style="cursor:pointer;opacity:0.6;font-size:11px;line-height:1;padding:1px 2px" title="Remove">✕</span>
        </span>`).join('')}
    </div>` : `<div style="font-size:13px;color:var(--text3);margin-bottom:10px">No categories yet.</div>`}
    <div class="tracker-manage-row">
      <input type="text" id="jcat-input" placeholder="New category name..." class="tracker-manage-input" onkeydown="if(event.key==='Enter')APP.addJournalCat()">
      <button class="btn-tracker-add" onclick="APP.addJournalCat()">+ Add</button>
    </div>
  </div>`;

  // Sidebar entries (max 10 visible, scrollable)
  const sidebarEntries = filteredEntries.map(j=>`
    <div class="journal-sidebar-item${selectedJournalKey===j.fbKey?' selected':''}" onclick="APP.selectJournal('${j.fbKey}')">
      <div class="journal-sidebar-date">${entryDateFmt(j)}</div>
      ${j.cat ? `<div style="margin:3px 0">${jCatPill(j.cat)}</div>` : ''}
      <div class="journal-sidebar-preview">${j.text.replace(/</g,'&lt;').substring(0,55)}</div>
    </div>`).join('');

  // Entry form cat select
  const catOpts = journalCats.length
    ? `<option value="">No category</option>` + journalCats.map(c=>`<option value="${c.fbKey}">${c.label}</option>`).join('')
    : '';

  // Reader / edit
  const selected = allEntries.find(j => j.fbKey === selectedJournalKey);
  let readerHtml = '';
  if(selected) {
    if(editingJournalKey === selected.fbKey) {
      const iso = entryDateISO(selected);
      const editCatOpts = journalCats.length
        ? `<option value="">No category</option>` + journalCats.map(c=>`<option value="${c.fbKey}"${selected.cat===c.fbKey?' selected':''}>${c.label}</option>`).join('')
        : '';
      const safeText = selected.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      readerHtml = `<div class="journal-reader visible">
        <div class="journal-edit-row">
          <input type="date" id="journal-edit-date" class="journal-edit-date" value="${iso}">
          ${editCatOpts ? `<select id="journal-edit-cat" class="journal-edit-cat">${editCatOpts}</select>` : ''}
        </div>
        <textarea id="journal-edit-ta" class="journal-edit-ta">${safeText}</textarea>
        <div class="journal-edit-actions">
          <button class="btn-cancel-edit" onclick="APP.cancelEditJournal()">Cancel</button>
          <button class="btn-save" onclick="APP.saveJournalEdit()">💾 Save</button>
        </div>
      </div>`;
    } else {
      readerHtml = `<div class="journal-reader visible">
        <div class="journal-entry-meta">
          <span class="journal-reader-date">${entryDateFmt(selected)}</span>
          ${selected.cat ? jCatPill(selected.cat) : ''}
        </div>
        <div class="journal-reader-text">${selected.text.replace(/</g,'&lt;')}</div>
        <div class="journal-item-actions" style="margin-top:14px;gap:8px">
          <button class="btn-edit" onclick="APP.startEditJournal('${selected.fbKey}')">✏️ Edit</button>
          <button class="btn-tiny" onclick="APP.deleteJournal('${selected.fbKey}')">Delete</button>
        </div>
      </div>`;
    }
  }

  const html = `<div class="journal-layout">
    <div class="journal-main">
      ${catManagerHtml}
      <div class="journal-entry-box">
        <div class="journal-edit-row">
          <input type="date" id="journal-date" class="journal-edit-date" value="${todayISO}">

        </div>
        <textarea id="journal-ta" placeholder="Write here... thoughts, reflections." onkeydown="if(event.ctrlKey&&event.key==='Enter')APP.saveJournal()" style="width:100%;font-size:19.6px;padding:12px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;resize:none;height:240px;line-height:1.7;transition:border-color 0.15s;box-sizing:border-box"></textarea>
        <div class="journal-footer">
          <span class="journal-date-lbl">Ctrl+Enter to save</span>
          <button class="btn-save" onclick="APP.saveJournal()">Save</button>
        </div>
      </div>
      ${filterBar}
      ${readerHtml}
      ${!filteredEntries.length ? `<div class="empty">${journalFilter==='all'?'No entries yet':'No entries in this category'}</div>` : ''}
    </div>
    <div class="journal-sidebar">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div class="journal-sidebar-title" style="margin:0">My Entries</div>
        ${allEntries.length ? `<button class="journal-export-btn" style="width:auto;padding:5px 12px;margin:0;font-size:13px" onclick="APP.exportJournalCSV()">⬇ CSV</button>` : ''}
      </div>
      <div style="overflow-y:auto;max-height:420px;display:flex;flex-direction:column;gap:8px">
        ${sidebarEntries || `<div style="font-size:13px;color:var(--text3);padding:8px 4px">No entries yet.</div>`}
      </div>
    </div>
  </div>`;
  el.innerHTML = html;
}

// ---- DAILY CHECK-IN ----

function renderCheckinDaily() {
  const el = document.getElementById('panel-checkin-daily');
  const allEntries = objToArr(wsd().checkin||{}).sort((a,b)=>b.createdAt-a.createdAt);
  const daily = allEntries.filter(e=>!e.weekly);
  const todayISO = localDateISO();

  function scoreColor(v){ if(v==null) return ''; if(v>=7) return 'ci-good'; if(v>=5) return 'ci-ok'; return 'ci-low'; }

  const dailyRows = daily.map(e=>{
    const d = new Date(e.createdAt);
    const dStr = d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    const note = e.energie!=null&&e.pensees!=null&&e.corps!=null ? Math.round(((+e.energie + +e.pensees + +e.corps)/3)*100)/100 : null;
    return `<tr>
      <td>${dStr}</td>
      <td class="ci-num ${scoreColor(e.energie)}">${e.energie??'—'}</td>
      <td class="ci-num ${scoreColor(e.pensees)}">${e.pensees??'—'}</td>
      <td class="ci-num ${scoreColor(e.corps)}">${e.corps??'—'}</td>
      <td class="ci-num ${scoreColor(note)}">${note??'—'}</td>
      <td><button class="ci-del-btn" onclick="APP.deleteCheckin('${e.fbKey}')" title="Delete">✕</button></td>
    </tr>`;
  }).join('');

  // Last 7 trend
  const last7 = daily.slice(0,7).reverse();
  const trendRows = last7.map(e=>{

function renderCheckinWeekly() {
  const el = document.getElementById('panel-checkin-weekly');
  const allEntries = objToArr(wsd().checkin||{}).sort((a,b)=>b.createdAt-a.createdAt);
  const daily = allEntries.filter(e=>!e.weekly);
  const weekly = allEntries.filter(e=>e.weekly);
  const todayISO = localDateISO();

  function scoreColor(v){ if(v==null) return ''; if(v>=7) return 'ci-good'; if(v>=5) return 'ci-ok'; return 'ci-low'; }
  const avgOf = (arr,key) => { const v=arr.filter(e=>e[key]!=null); return v.length?Math.round(v.reduce((s,e)=>s+(+e[key]),0)/v.length*100)/100:null; };

  const weeklyRows = weekly.map(e=>{
    const d = new Date(e.createdAt);
    const dStr = d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const wStart = new Date(e.createdAt); wStart.setHours(0,0,0,0);
    const wEnd = new Date(wStart); wEnd.setDate(wStart.getDate()+7);
    const weekDailies = daily.filter(de=>{const t=de.createdAt;return t>=wStart.getTime()&&t<wEnd.getTime();});
    const avgE = weekDailies.length ? Math.round(weekDailies.reduce((s,d)=>s+(+d.energie||0),0)/weekDailies.length*100)/100 : null;
    const avgP = weekDailies.length ? Math.round(weekDailies.reduce((s,d)=>s+(+d.pensees||0),0)/weekDailies.length*100)/100 : null;
    const avgC = weekDailies.length ? Math.round(weekDailies.reduce((s,d)=>s+(+d.corps||0),0)/weekDailies.length*100)/100 : null;
    return `<tr>
      <td>${dStr}</td>
      <td class="ci-num ${scoreColor(avgE)}">${avgE??'—'}</td>
      <td class="ci-num ${scoreColor(avgP)}">${avgP??'—'}</td>
      <td class="ci-num ${scoreColor(e.repos)}">${e.repos??'—'}</td>
      <td class="ci-num ${scoreColor(avgC)}">${avgC??'—'}</td>
      <td class="ci-num ${scoreColor(e.couple)}">${e.couple??'—'}</td>
      <td class="ci-num">${e.poids!=null?e.poids+' lbs':'—'}</td>
      <td><button class="ci-del-btn" onclick="APP.deleteCheckin('${e.fbKey}')" title="Delete">✕</button></td>
    </tr>`;
  }).join('');

  // Stats
  const avgEnergie = avgOf(daily,'energie');
  const avgPensees = avgOf(daily,'pensees');
  const avgCorps   = avgOf(daily,'corps');
  const avgRepos   = avgOf(weekly,'repos');
  const avgCouple  = avgOf(weekly,'couple');
  const poidsStart = weekly.length ? weekly[weekly.length-1].poids : null;
  const poidsCur   = weekly.length ? weekly[0].poids : null;
  const poidsDelta = poidsStart&&poidsCur ? Math.round((poidsCur-poidsStart)*10)/10 : null;
  const globalAvg  = [avgEnergie,avgPensees,avgCorps,avgRepos,avgCouple].filter(v=>v!=null);
  const globalScore= globalAvg.length ? Math.round(globalAvg.reduce((s,v)=>s+v,0)/globalAvg.length*100)/100 : null;

  function statCard(val,lbl,suffix=''){
    const pct = suffix===''&&val!=null ? (val/10)*100 : 50;
    return `<div class="stat-card-sm">
      <div class="stat-val-sm ${val!=null?scoreColor(val):''}">${val!=null?val+suffix:'—'}</div>
      <div class="stat-lbl-sm">${lbl}</div>
      ${suffix===''&&val!=null?`<div class="trend-bar-wrap"><div class="trend-bar" style="width:${pct}%"></div></div>`:''}
    </div>`;
  }

  el.innerHTML = `
    <div class="checkin-form-grid" style="grid-template-columns:1fr">
      <div class="checkin-card">
        <div class="checkin-card-title">📋 Weekly Check-in</div>
        <div class="ci-field"><label>📆 Date (start of week)</label><input type="date" id="ci-date-weekly" value="${todayISO}"></div>
        <div class="ci-field"><label>😴 Rest / Sleep /10</label><input type="number" id="ci-repos" min="0" max="10" step="0.5" placeholder="e.g. 7"></div>
        <div class="ci-field"><label>❤️ Relationship /10</label><input type="number" id="ci-couple" min="0" max="10" step="0.5" placeholder="e.g. 8"></div>
        <div class="ci-field"><label>⚖️ Weight (lbs)</label><input type="number" id="ci-poids" min="100" max="400" step="0.1" placeholder="e.g. 258.5"></div>
        <button class="btn-checkin-save weekly" onclick="APP.saveCheckin(true)">💾 Save week</button>
      </div>
    </div>
    <div style="margin-top:20px">
      <div class="stat-section-title">Overall averages</div>
      <div class="stats-grid-2">
        ${statCard(globalScore,'🏆 Global score')}
        ${statCard(avgEnergie,'⚡ Avg energy')}
        ${statCard(avgPensees,'🧠 Avg thoughts')}
        ${statCard(avgCorps,'💪 Avg body')}
        ${statCard(avgRepos,'😴 Avg rest')}
        ${statCard(avgCouple,'❤️ Avg relationship')}
        ${statCard(poidsCur,'⚖️ Current weight',' lbs')}
        ${statCard(poidsDelta!=null?(poidsDelta>0?'+'+poidsDelta:poidsDelta):null,'📉 Weight change',' lbs')}
      </div>
    </div>
    <div style="margin-top:20px">
      <div class="ci-export-row"><button class="btn-export-sm" onclick="APP.exportCheckinCSV('weekly')">⬇ Export CSV</button></div>
      <div class="checkin-table-wrap"><table class="checkin-table">
        <thead><tr><th>Week</th><th>⚡ Avg energy</th><th>🧠 Avg thoughts</th><th>😴 Rest</th><th>💪 Avg body</th><th>❤️ Relationship</th><th>⚖️ Weight</th><th></th></tr></thead>
        <tbody>${weekly.length?weeklyRows:'<tr><td colspan="8" style="text-align:center;color:var(--text3);padding:24px">No weekly entries</td></tr>'}</tbody>
      </table></div>
    </div>`;
}

async function saveCheckin(isWeekly) {
  const getVal = id => { const el=document.getElementById(id); if(!el||el.value==='') return null; return parseFloat(el.value); };
  const dateEl = document.getElementById(isWeekly ? 'ci-date-weekly' : 'ci-date-daily');
  const dateVal = dateEl ? dateEl.value : null;
  const ts = dateVal ? new Date(dateVal+'T12:00:00').getTime() : Date.now();
  const entry = { createdAt: ts, weekly: isWeekly };

  if(!isWeekly) {
    entry.energie = getVal('ci-energie');
    entry.pensees  = getVal('ci-pensees');
    entry.corps    = getVal('ci-corps');
    if(entry.energie==null&&entry.pensees==null&&entry.corps==null){ alert('Enter at least one value.'); return; }
  } else {
    entry.repos  = getVal('ci-repos');
    entry.couple = getVal('ci-couple');
    entry.poids  = getVal('ci-poids');
    if(entry.repos==null&&entry.couple==null&&entry.poids==null){ alert('Enter at least one value.'); return; }
    const dayStart = ts - 12 * 3600000;
    const allDaily = objToArr(wsd().checkin||{})
      .filter(e=>!e.weekly && e.createdAt >= dayStart - 6*86400000 && e.createdAt < dayStart + 86400000);
    const avg = key => { const vals = allDaily.filter(e=>e[key]!=null); return vals.length ? Math.round(vals.reduce((s,e)=>s+(+e[key]),0)/vals.length*100)/100 : null; };
    entry.energie = avg('energie');
    entry.pensees  = avg('pensees');
    entry.corps    = avg('corps');
  }

  setSyncStatus('wait');
  await push(userDataPath(`${ws}/checkin`), entry);
  ['ci-energie','ci-pensees','ci-corps','ci-repos','ci-couple','ci-poids'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
}

async function deleteCheckin(fbKey) {
  setSyncStatus('wait');
  await remove(ref(db,`users/${currentUID}/${ws}/checkin/${fbKey}`));
}

function exportCheckinCSV(type) {
  const allEntries = objToArr(wsd().checkin||{}).sort((a,b)=>b.createdAt-a.createdAt);
  const entries = type==='weekly' ? allEntries.filter(e=>e.weekly) : allEntries.filter(e=>!e.weekly);
  if(!entries.length){ alert('No data to export.'); return; }
  let rows, filename;
  if(type==='daily') {
    rows = [['Date','Energy','Intense Thoughts','Body / Food','Average']];
    entries.forEach(e=>{
      const d = new Date(e.createdAt).toLocaleDateString('en-US');
      const note = e.energie!=null&&e.pensees!=null&&e.corps!=null ? Math.round(((+e.energie + +e.pensees + +e.corps)/3)*100)/100 : '';
      rows.push([d,e.energie??'',e.pensees??'',e.corps??'',note]);
    });
    filename = 'checkin-daily.csv';
  } else {
    rows = [['Week','Avg Energy','Avg Thoughts','Rest','Avg Body','Relationship','Weight (lbs)']];
    entries.forEach(e=>{
      const d = new Date(e.createdAt).toLocaleDateString('en-US');
      rows.push([d,e.energie??'',e.pensees??'',e.repos??'',e.corps??'',e.couple??'',e.poids??'']);
    });
    filename = 'checkin-weekly.csv';
  }
  downloadCSV(rows, filename);
}

const LEGACY_DEFAULT_TRACKER_BUTTONS = [
  {key:'badminton', label:'🏸 Badminton',       cat:'green'},
  {key:'marche',    label:'🚶 Walk',             cat:'green'},
  {key:'gym',       label:'💪 Gym',              cat:'green'},

  {key:'binge',     label:'📺 Binge',            cat:'red'},
  {key:'depanneur', label:'🏪 Convenience store',cat:'red'},
  {key:'alcool',    label:'🍺 Alcohol',          cat:'red'},
];

const TRACKER_TUTORIAL_EXAMPLES = [
  LEGACY_DEFAULT_TRACKER_BUTTONS[0], LEGACY_DEFAULT_TRACKER_BUTTONS[2], LEGACY_DEFAULT_TRACKER_BUTTONS[3],
  LEGACY_DEFAULT_TRACKER_BUTTONS[6], LEGACY_DEFAULT_TRACKER_BUTTONS[7], LEGACY_DEFAULT_TRACKER_BUTTONS[9],
];

function getTrackerItems() {
  const custom = objToArr(wsd().tracker_buttons||{}).map(b=>({key:b.key,label:b.label,cat:b.cat,fbKey:b.fbKey,isCustom:true}));
  const defaultKeys = new Set(DEFAULT_TRACKER_BUTTONS.map(d=>d.key));
  const customNew = custom.filter(c=>!defaultKeys.has(c.key));
  return [...DEFAULT_TRACKER_BUTTONS, ...customNew];
}

// One-time-per-key migration: if a user already has entries logged against an
// old default key but never has a matching custom button, silently create one
// so their history keeps displaying/counting correctly. No-op for new users
// who never used those keys, and idempotent once migrated.
function migrateLegacyTrackerButtons() {
  const entries = objToArr(wsd().tracker||{});
  if(!entries.length) return;
  const existingKeys = new Set(objToArr(wsd().tracker_buttons||{}).map(b=>b.key));
  const usedKeys = new Set(entries.map(e=>e.key));
  LEGACY_DEFAULT_TRACKER_BUTTONS
    .filter(d=>usedKeys.has(d.key) && !existingKeys.has(d.key))
    .forEach(d=>push(userDataPath(`${ws}/tracker_buttons`), {key:d.key, label:d.label, cat:d.cat}));
}

const WEEK1_START  = new Date('2026-04-27T04:00:00').getTime();
const Q1_START     = new Date('2026-04-27T00:00:00').getTime();
const Q1_DAYS      = 91;
const WEEK_MS      = 7 * 86400000;
const Q1_MS        = Q1_DAYS * 86400000;

function getCurrentQ1Start() {
  const qArchives = objToArr(wsd().tracker_q_archives||{}).sort((a,b)=>a.startTs-b.startTs);
  if(!qArchives.length) return Q1_START;
  const last = qArchives[qArchives.length-1];
  return last.endTs || Q1_START;
}

function renderTracker() {
  const el = document.getElementById('panel-tracker');
  const ITEMS = getTrackerItems();
  if(trackerFilterCat!=='all' && !ITEMS.some(i=>i.key===trackerFilterCat)) trackerFilterCat = 'all';
  const entries = objToArr(wsd().tracker||{});
  const archives = objToArr(wsd().tracker_archives||{}).sort((a,b)=>b.weekStart-a.weekStart);
  const qArchives = objToArr(wsd().tracker_q_archives||{}).sort((a,b)=>b.startTs-a.startTs);

  const now = Date.now();
  const q1Start   = getCurrentQ1Start();
  const q1End     = q1Start + Q1_MS;

  if(now >= q1End && !data._flags?.q1Archived) archiveQ1(q1Start, q1End, entries);

  function counts(fromTs, toTs) {
    const c = {};
    ITEMS.forEach(i=>c[i.key]=0);
    entries.filter(e=>e.ts>=fromTs && (toTs==null||e.ts<toTs)).forEach(e=>{ c[e.key] = (c[e.key]||0) + 1; });
    return c;
  }

  const allC  = counts(0);

  const green = ITEMS.filter(i=>i.cat==='green');
  const red   = ITEMS.filter(i=>i.cat==='red');

  function btnGroup(items) {
    return items.map(i=>`
      <button class="tracker-btn ${i.cat}" onclick="APP.logTracker('${i.key}')">
        ${i.label}<span class="tracker-btn-count">${allC[i.key]}</span>
      </button>`).join('');
  }

  let archiveHtml = '';
  if(archives.length || qArchives.length) {
    archiveHtml = `<div class="tracker-divider"></div><div class="tracker-archive-section"><div class="tracker-section-title">📦 Archives</div>`;
    if(archives.length) {
      archiveHtml += `<div class="tracker-archive-sub">Weeks</div>`;
      archiveHtml += archives.map(a=>{
        const wDate = new Date(a.weekStart).toLocaleDateString('en-US',{month:'short',day:'numeric'});
        const gT = getTrackerItems().filter(i=>i.cat==='green').reduce((s,i)=>s+(a.counts[i.key]||0),0);
        const rT = getTrackerItems().filter(i=>i.cat==='red').reduce((s,i)=>s+(a.counts[i.key]||0),0);

          <div class="tracker-archive-items">${getTrackerItems().map(i=>`<span class="tracker-arc-item ${i.cat}">${i.label} <strong>${a.counts[i.key]||0}</strong></span>`).join('')}</div>
        </div>`;
      }).join('');
    }
    if(qArchives.length) {
      archiveHtml += `<div class="tracker-archive-sub" style="margin-top:14px">Quarters</div>`;
      archiveHtml += qArchives.map(a=>{
        const dStr = new Date(a.startTs).toLocaleDateString('en-US',{month:'short',day:'numeric'}) + ' → ' + new Date(a.endTs).toLocaleDateString('en-US',{month:'short',day:'numeric'});
        const gT = getTrackerItems().filter(i=>i.cat==='green').reduce((s,i)=>s+(a.counts[i.key]||0),0);
        const rT = getTrackerItems().filter(i=>i.cat==='red').reduce((s,i)=>s+(a.counts[i.key]||0),0);

          <div class="tracker-archive-header"><span class="tracker-archive-title">Q${a.quarterNum} — ${dStr}</span><button class="btn-export-sm" onclick="APP.exportTrackerQArchiveCSV('${a.fbKey}')">⬇ CSV</button></div>

        </div>`;
      }).join('');
    }
    archiveHtml += '</div>';
  }

  const sortedEntries = [...entries].sort((a,b)=>b.ts-a.ts);
  const filteredEntries = sortedEntries.filter(e=>{
    if(trackerFilterCat!=='all' && e.key!==trackerFilterCat) return false;

  const isEmpty = ITEMS.length === 0;

  const tutorialHtml = `

    </div>`;

  const btnsHtml = isEmpty ? tutorialHtml : `
    <div class="tracker-section-title">✅ Positive</div>

function checkAutoWeeklyReport() {
  const now = new Date();
  const reports = objToArr(wsd().weekly_reports||{});
  const d = new Date(now);
  const dayOfWeek = d.getDay();
  const daysSinceMon = dayOfWeek === 0 ? 6 : dayOfWeek - 1;
  const lastMonday4am = new Date(d);
  lastMonday4am.setDate(d.getDate() - daysSinceMon);
  lastMonday4am.setHours(4, 0, 0, 0);
  if(now < lastMonday4am) lastMonday4am.setDate(lastMonday4am.getDate() - 7);
  const reportTs = lastMonday4am.getTime();
  if(reportTs < WEEK1_START) return;
  const alreadyDone = reports.some(r => Math.abs(r.generatedFor - reportTs) < 3600000);
  if(alreadyDone) return;
  generateWeeklyReport(reportTs);
}

async function generateWeeklyReport(reportTs) {
  const windowStart = reportTs - 7 * 86400000;
  const windowEnd   = reportTs;
  const tasks      = objToArr(wsd().tasks||{});
  const history    = objToArr(wsd().history||{});
  const journal    = objToArr(wsd().journal||{});
  const checkin    = objToArr(wsd().checkin||{});
  const trackerEnt = objToArr(wsd().tracker||{});
  const ITEMS      = getTrackerItems();
  const completedTasks = history.filter(h=>h.completedAt>=windowStart&&h.completedAt<windowEnd);
  const addedTasks = [...tasks,...history].filter(t=>t.createdAt>=windowStart&&t.createdAt<windowEnd);
  const journalEntries = journal.filter(j=>j.createdAt>=windowStart&&j.createdAt<windowEnd);
  const trackerCounts = {};
  ITEMS.forEach(i=>trackerCounts[i.key]=0);
  trackerEnt.filter(e=>e.ts>=windowStart&&e.ts<windowEnd).forEach(e=>{ if(trackerCounts[e.key]!=null) trackerCounts[e.key]++; });
  const dailies = checkin.filter(e=>!e.weekly&&e.createdAt>=windowStart&&e.createdAt<windowEnd);
  const avgOf = key => { const v=dailies.filter(e=>e[key]!=null); return v.length?Math.round(v.reduce((s,e)=>s+(+e[key]),0)/v.length*100)/100:null; };
  const weeklyBefore = checkin.filter(e=>e.weekly&&e.createdAt<windowEnd).sort((a,b)=>b.createdAt-a.createdAt);
  const curPoids  = weeklyBefore[0]?.poids!=null ? +weeklyBefore[0].poids : null;
  const prevPoids = weeklyBefore[1]?.poids!=null ? +weeklyBefore[1].poids : null;
  const firstWeekly = checkin.filter(e=>e.weekly&&e.poids!=null).sort((a,b)=>a.createdAt-b.createdAt);
  const s1Poids = firstWeekly[0]?.poids!=null ? +firstWeekly[0].poids : null;
  const weekNum = Math.floor((reportTs - WEEK1_START) / WEEK_MS) + 1;
  const report = {
    generatedFor: reportTs, weekNum, windowStart, windowEnd,
    completedCount: completedTasks.length, addedCount: addedTasks.length, journalCount: journalEntries.length,
    trackerCounts, trackerItems: ITEMS.map(i=>({key:i.key,label:i.label,cat:i.cat})),
    avgEnergie: avgOf('energie'), avgPensees: avgOf('pensees'), avgCorps: avgOf('corps'),
    avgNote: dailies.length ? Math.round(dailies.filter(e=>e.energie!=null&&e.pensees!=null&&e.corps!=null).reduce((s,e)=>s+((+e.energie+(+e.pensees)+(+e.corps))/3),0)/dailies.length*100)/100 : null,
    curPoids, prevPoids, s1Poids,
    poidsDeltaWeek: curPoids!=null&&prevPoids!=null ? Math.round((curPoids-prevPoids)*10)/10 : null,
    poidsDeltaS1:   curPoids!=null&&s1Poids!=null  ? Math.round((curPoids-s1Poids)*10)/10   : null,
    completedTitles: completedTasks.slice(0,5).map(t=>t.title||''),
    journalPreviews: journalEntries.slice(0,3).map(j=>(j.text||'').substring(0,80)),
  };
  setSyncStatus('wait');
  await push(userDataPath(`${ws}/weekly_reports`), report);
}

let dragSrcId = null;

function tabDragStart(e, id) {
  dragSrcId = id;
  e.target.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function tabDragOver(e, id) {
  if(id === dragSrcId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}

function tabDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

function tabDragEnd(e) {
  e.target.classList.remove('dragging');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('drag-over'));
}

async function tabDrop(e, targetId) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(!dragSrcId || dragSrcId === targetId) return;
  const mods = [...(userModules || [])];
  const fromIdx = mods.indexOf(dragSrcId);
  const toIdx   = mods.indexOf(targetId);
  if(fromIdx === -1 || toIdx === -1) return;
  mods.splice(fromIdx, 1);
  mods.splice(toIdx, 0, dragSrcId);
  userModules = mods;
  await fbSet(ref(db, `users/${currentUID}/settings/modules`), mods);
  renderTabs();
}

function get7amTomorrowToronto() {
  const now = new Date();
  const todayToronto = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'America/Toronto', year: 'numeric', month: '2-digit', day: '2-digit'
  }).format(now);
  const [y, m, d] = todayToronto.split('-').map(Number);
  // Noon UTC tomorrow — safely within tomorrow in all timezones
  const noonUTC = new Date(Date.UTC(y, m - 1, d + 1, 12, 0, 0));
  // What hour is noon UTC in Toronto on that day?
  const torontoHour = parseInt(new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/Toronto', hour: 'numeric', hour12: false
  }).format(noonUTC), 10);
  // Shift noon UTC by (7 - torontoHour) hours to land on 7am Toronto
  return noonUTC.getTime() + (7 - torontoHour) * 3600000;
}

function collectLast14Days() {
  const now = Date.now();
  const cutoff = now - 14 * 86400000;

  // Checkin
  const checkins = objToArr(data.vie.checkin || {})
    .filter(e => e.createdAt >= cutoff)
    .sort((a, b) => a.createdAt - b.createdAt)
    .map(e => {
      const date = new Date(e.createdAt).toLocaleDateString('en-CA', { timeZone: 'America/Toronto' });
      if (e.weekly) return { date, type: 'weekly', repos: e.repos, couple: e.couple, poids: e.poids };
      return { date, type: 'daily', energie: e.energie, pensees: e.pensees, corps: e.corps };
    });

  // Journal
  const journals = objToArr(data.vie.journal || {})
    .filter(e => e.createdAt >= cutoff)
    .sort((a, b) => a.createdAt - b.createdAt)
    .map(e => {
      const date = e.entryDate || new Date(e.createdAt).toLocaleDateString('en-CA', { timeZone: 'America/Toronto' });
      const hour = new Date(e.createdAt).getHours();
      return { date, hour_written: hour, text: e.text };
    });

  // Tracker buttons (to map keys → labels/colors)
  const btnMap = {};
  objToArr(data.vie.tracker_buttons || {}).forEach(b => { btnMap[b.key] = { label: b.label, cat: b.cat }; });

  // Tracker log
  const tracker = objToArr(data.vie.tracker || {})
    .filter(e => e.ts >= cutoff)
    .sort((a, b) => a.ts - b.ts)
    .map(e => {
      const date = new Date(e.ts).toLocaleDateString('en-CA', { timeZone: 'America/Toronto' });
      const meta = btnMap[e.key] || { label: e.key, cat: 'unknown' };
      return { date, key: e.key, label: meta.label, color: meta.cat };
    });

  return { checkins, journals, tracker };
}

    const resp = await fetch(FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uid: currentUID, systemPrompt, userMsg }),
    });

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error || `Function error ${resp.status}`);
    }

    const result = await resp.json();
    const rawText = result.content?.[0]?.text || '';
    const jsonMatch = rawText.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('Agent returned unexpected format.');
    const decision = JSON.parse(jsonMatch[0]);

    if (decision.send_email) {
      // Write to mail queue — process with a Cloud Function
      const user = auth.currentUser;
      await push(ref(db, `users/${currentUID}/mail_queue`), {
        to: user.email,
        subject: decision.subject,
        body: decision.body,
        send_at: get7amTomorrowToronto(),
        status: 'pending',
        created_at: Date.now(),
      });
      setAgentBtn('ok', '✓ Email queued for 7 AM');
    } else {
      setAgentBtn('ok', '✓ All good');
    }

    setTimeout(() => setAgentBtn('', '🤖 Send to Agent'), 5000);
  } catch (e) {
    console.error('[agent]', e);
    setAgentBtn('err', '✗ ' + (e.message.length > 40 ? 'Error — check console' : e.message));
    setTimeout(() => setAgentBtn('', '🤖 Send to Agent'), 4000);
  }
}
